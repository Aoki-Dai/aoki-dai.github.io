const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const idb=(mode,fn)=>new Promise((res,rej)=>{const o=indexedDB.open("aside-artifacts",1);o.onupgradeneeded=()=>o.result.createObjectStore("k");o.onerror=()=>rej(o.error);o.onsuccess=()=>{const t=o.result.transaction("k",mode);const q=fn(t.objectStore("k"));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);};});
const derive=async pw=>crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(D.salt),iterations:D.iter,hash:"SHA-256"},await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]),{name:"AES-GCM",length:256},false,["decrypt"]);
const dec=async k=>new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(D.iv)},k,b64(D.ct)));
const show=h=>{document.open();document.write(h);document.close();};
(async()=>{try{const k=await idb("readonly",s=>s.get(D.salt));if(k){show(await dec(k));return;}}catch(_){}

if(document.getElementById("r").checked){try{await idb("readwrite",s=>s.put(k,D.salt));}catch(_){}}show(h);}
catch(_){e.textContent="パスワードが違います";b.disabled=false;b.textContent="開く";}};})();
