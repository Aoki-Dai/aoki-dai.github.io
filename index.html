<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>🔒 Aside アーティファクト</title><style>
:root{color-scheme:light dark;--bg:#fff;--fg:#111;--mut:#666;--line:#ddd;--acc:#111;--accfg:#fff}

*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;padding:20px}
form{width:100%;max-width:360px}h1{font-size:20px;margin:0 0 4px}p{color:var(--mut);font-size:13px;margin:0 0 20px}
.u{position:absolute;left:-9999px;width:1px;height:1px}
input[type=password]{width:100%;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:transparent;color:inherit}
label{display:flex;gap:8px;align-items:center;font-size:14px;margin:14px 0;min-height:40px}label input{width:20px;height:20px}
button{width:100%;font-size:16px;font-weight:700;padding:13px;border:0;border-radius:10px;background:var(--acc);color:var(--accfg)}
#e{color:#e5484d;font-size:13px;min-height:20px;margin-top:10px}
</style></head><body><form id="f" hidden><h1>🔒 Aside アーティファクト</h1><p>パスワードで保護されています</p>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const idb=(mode,fn)=>new Promise((res,rej)=>{const o=indexedDB.open("aside-artifacts",1);o.onupgradeneeded=()=>o.result.createObjectStore("k");o.onerror=()=>rej(o.error);o.onsuccess=()=>{const t=o.result.transaction("k",mode);const q=fn(t.objectStore("k"));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);};});
